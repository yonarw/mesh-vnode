# Publishes the image the Home Assistant add-on pulls.
#
# The version comes from `version` in pyproject.toml - not from a git tag, and
# not from anything typed here. The add-on does not build on the user's machine:
# addon/config.yaml names <image>:<version> and the Supervisor pulls it, so the
# tag pushed here has to match. scripts/bump-version.sh writes both; the `check`
# job below refuses to build if they ever drift.
#
# Pushing to main is the release trigger. The build is skipped when the image
# for that version already exists, so ordinary commits cost one cheap job.
name: Add-on image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.exists.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      # The same script you can run locally, so this cannot fail for a reason
      # that only exists on the runner.
      - id: v
        name: Check the version is consistent, and read it
        run: |
          version=$(scripts/check-version-sync.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project version: $version"

      - id: exists
        name: Skip if this version was already published
        run: |
          version='${{ steps.v.outputs.version }}'
          image="ghcr.io/${{ github.repository_owner }}/mesh-vnode:$version"
          token=$(echo -n '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${{ github.repository_owner }}/mesh-vnode/manifests/$version")
          if [ "$code" = "200" ]; then
            echo "$image already exists - nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 for Home Assistant OS on a Pi, amd64 for everything else. armv7 is
      # left out on purpose: the dependency wheels make it a slow, fragile build.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mesh-vnode:${{ needs.check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mesh-vnode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag is now a marker for `git checkout v0.1.1`, not an input to
      # anything - the image above was built and named without it.
      - name: Tag the release commit
        run: |
          version='${{ needs.check.outputs.version }}'
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
