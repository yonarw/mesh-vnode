[project]
name = "mesh-vnode"
version = "0.2.0"
description = "A virtual node with a persistent message store, for use with Meshtastic(R) meshes"
readme = "README.md"
requires-python = ">=3.11"
# GPL-3.0 because this links meshtastic-python, which is GPL-3.0-only.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "meshtastic>=2.7.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # config.py reads a YAML config file through pydantic-settings.
    "pyyaml>=6",
    "typer>=0.15",
]

[project.scripts]
mesh-vnode = "mesh_vnode.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh_vnode"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008 is how typer declares options.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Raised inside starlette's own testclient (it uses an anyio alias anyio
    # has deprecated); nothing in this project to fix. Drop once starlette does.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
